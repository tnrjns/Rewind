[package]
name = "rewind-engine"
description = "Headless capture engine for Rewind: instant replay ring buffer, recordings, screenshots, trim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_Media_Audio",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
# Only macOS has to fetch FFmpeg itself; the Windows installer ships it.
ureq = { version = "3", features = ["gzip"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
