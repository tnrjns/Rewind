[package]
name = "rewind-app"
description = "Rewind's desktop shell: global hotkeys, tray, and the glue that drives the capture engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rewind-engine = { path = "../rewind-engine" }
serde_json = "1"

# The tray needs a platform window/event loop, so it is optional: the library stays
# headless-testable without it, and the binary turns it on.
tray-icon = { version = "0.26", optional = true }
muda = { version = "0.21", optional = true }
png = { version = "0.18", optional = true }
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
trash = "5"
rfd = "0.18"

[features]
default = []
tray = ["dep:tray-icon", "dep:muda", "dep:png"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
] }
