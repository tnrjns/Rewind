name: CI

on:
  push:
    branches: [main, macos]
  pull_request:

jobs:
  smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app main.py
      - run: python tests/smoke.py

  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # FFmpeg is only needed by the capture tests, which skip themselves without it.
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: cargo test
      # The tray is behind a feature; build it too so it cannot rot unnoticed.
      - run: cargo build --release
      - if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets --features rewind-app/tray -- -D warnings
      - if: runner.os == 'macOS'
        run: cargo build -p rewind-app --features tray
